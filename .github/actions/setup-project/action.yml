name: Setup Node.js and dependencies
description: Setup Node.js environment with pnpm dependencies

inputs:
  node-version:
    description: Node.js version
    required: true
  restore-nextjs-cache:
    description: Whether to restore Next.js build cache
    required: false
    default: 'false'
  working-directory:
    description: Path to the workspace app whose Next.js build cache should be restored
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Next.js build output
      if: inputs.restore-nextjs-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ inputs.working-directory }}/.next
          ${{ inputs.working-directory }}/next-env.d.ts
        key: nextjs-build-${{ inputs.working-directory }}-${{ inputs.node-version }}-${{ github.sha }}
        fail-on-cache-miss: true
