name: Identity & patient CI

on:
  push:
    branches: [main]
    paths:
      - 'identity-patient/**'
      - '.github/workflows/identity-patient-ci.yml'
      - '.github/actions/setup-project/**'
  pull_request:
    branches: [main]
    paths:
      - 'identity-patient/**'
      - '.github/workflows/identity-patient-ci.yml'
      - '.github/actions/setup-project/**'

defaults:
  run:
    working-directory: identity-patient

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            identity-patient/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-identity-patient-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('identity-patient/src/**') }}

      - name: Build Next.js
        run: pnpm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            identity-patient/.next
            identity-patient/next-env.d.ts
          key: nextjs-build-identity-patient-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        working-directory: .
        run: npx commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Linter
        run: pnpm exec next typegen && pnpm run lint

      - name: Type checking
        run: pnpm run check:types

      - name: Check dependencies
        run: pnpm run check:deps

      - name: I18n check
        run: pnpm run check:i18n

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.61.0
        with:
          args: sh -c "cd identity-patient && npx --yes pnpm@11.5.2 run test -- --coverage"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: identity-patient/coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run storybook tests
        uses: docker://mcr.microsoft.com/playwright:v1.61.0
        with:
          args: sh -c "cd identity-patient && npx --yes pnpm@11.5.2 run storybook:test"

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true
          working-directory: identity-patient

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.61.0
        with:
          args: sh -c "cd identity-patient && HOME=/root npx --yes pnpm@11.5.2 run test:e2e" # Set HOME to /root to avoid Playwright error with Firebox
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Fix test results permission # Give permissions to test results needed by Chromatic
        run: |
          sudo chmod -R 777 test-results

      - name: Run visual regression tests
        uses: chromaui/action@v17
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          workingDir: identity-patient
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: identity-patient/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, static, unit, storybook, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Install Vercel CLI
        working-directory: .
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.IDENTITY_PATIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.IDENTITY_PATIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.IDENTITY_PATIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.IDENTITY_PATIENT_VERCEL_PROJECT_ID }}

  synchronize-with-crowdin:
    name: GitHub PR synchronize with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # Crowdin Actions needs to push commits to the PR branch, checkout HEAD commit instead of merge commit
          fetch-depth: 0

      - name: Crowdin action
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          create_pull_request: false
          localization_branch_name: ${{ github.head_ref || github.ref_name }} # explanation here: https://stackoverflow.com/a/71158878
          commit_message: 'chore: new Crowdin translations by GitHub Action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
