name: Notification CI

on:
  push:
    branches: [main]
    paths:
      - 'notification/**'
      - '.github/workflows/notification-ci.yml'
      - '.github/actions/setup-project/**'
  pull_request:
    branches: [main]
    paths:
      - 'notification/**'
      - '.github/workflows/notification-ci.yml'
      - '.github/actions/setup-project/**'

defaults:
  run:
    working-directory: notification

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build Next.js
        run: pnpm run build
        env:
          MAILTRAP_HOST: sandbox.smtp.mailtrap.io
          MAILTRAP_PORT: '2525'
          MAILTRAP_USER: ci-placeholder
          MAILTRAP_PASS: ci-placeholder
          MAIL_FROM_ADDRESS: no-reply@easyhealth.dev
          MAIL_FROM_NAME: EasyHealth
          CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_placeholder

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Linter
        run: pnpm run lint

      - name: Type checking
        run: pnpm run check:types

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: pnpm run test

  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, static, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Install Vercel CLI
        working-directory: .
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.NOTIFICATION_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.NOTIFICATION_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.NOTIFICATION_VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.NOTIFICATION_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.NOTIFICATION_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.NOTIFICATION_VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.NOTIFICATION_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.NOTIFICATION_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.NOTIFICATION_VERCEL_PROJECT_ID }}
