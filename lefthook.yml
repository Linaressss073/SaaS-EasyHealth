# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}

# Validate content before committing
# Jobs are scoped to identity-patient/ via `root` until other services have their own lint/type config
# piped: sequential, not parallel — parallel pnpm processes race on node_modules symlinks
# in this workspace and produce flaky "Cannot find module" failures under load.
pre-commit:
  piped: true
  jobs:
    - name: lint
      root: 'identity-patient/'
      run: npx --no -- eslint --fix --no-warn-ignored {staged_files}
      glob: '*'
      stage_fixed: true
    - name: check-types
      root: 'identity-patient/'
      # Call tsc's local bin directly instead of `pnpm run` — invoking pnpm here
      # triggers a store re-sync that has intermittently unlinked packages mid-run.
      run: node_modules/.bin/tsc --noEmit --pretty
      glob: '*.{ts,tsx}'
    - name: knip
      root: 'identity-patient/'
      run: node_modules/.bin/knip --config knip.config.mjs
      glob: '*'
